<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0c151c">
  <meta name="description" content="Learn 90 Linux commands with bite-sized quizzes, detailed explanations, and mistake-based retraining. Works offline.">
  <meta name="application-name" content="Linux Drill">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Linux Drill">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <link rel="stylesheet" href="./styles.css">
  <title>Linux Drill — Learn the Terminal</title>
  <script src="./data.js" defer></script>
  <script src="./app.js" defer></script>
</head>
<body>
  <div class="ambient ambient-one" aria-hidden="true"></div>
  <div class="ambient ambient-two" aria-hidden="true"></div>
  <div class="app-shell" id="app-shell">
    <header class="app-header" id="app-header">
      <div class="brand" aria-label="Linux Drill">
        <span class="brand-mark" aria-hidden="true">$_</span>
        <span class="brand-name">linux<span class="brand-highlight">drill</span><span class="brand-cursor">_</span></span>
      </div>
      <button id="header-action" class="header-action" aria-label="More information" hidden></button>
    </header>
    <main id="screen" class="screen" aria-live="polite" aria-atomic="false"></main>
    <nav id="bottom-nav" class="bottom-nav" aria-label="Main navigation">
      <button class="nav-item is-active" data-nav="home" aria-label="Practice"></button>
      <button class="nav-item" data-nav="library" aria-label="Command library"></button>
      <button class="nav-item" data-nav="progress" aria-label="Progress"></button>
    </nav>
  </div>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <noscript><p class="noscript">Linux Drill needs JavaScript enabled to run the interactive quizzes.</p></noscript>
</body>
</html>
